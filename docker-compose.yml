services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  cbc-backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/cbc_database
    depends_on:
      - mongo

  cbc-frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - cbc-backend

  rag-service:
    build: ./rag-service
    ports:
      - "8000:8000"
    env_file:
      - ./rag-service/.env

volumes:
  mongo-data: